        rubric_additions: [说明各方 KPI 和约束, 说明共同目标和 RACI, 说明风险升级机制]
        expected_signals: [能画清责任边界, 能设计节奏和升级路径, 能平衡目标和关系]
        anti_patterns: [只开会不决策, 责任人不清, 风险暴露太晚]
