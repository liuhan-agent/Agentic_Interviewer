dimension: stakeholder_management
seeds:
  - id: stakeholder_management.cross_team_alignment
    version: 1
    title: 跨团队协同与冲突收敛
    dimension: stakeholder_management
    job_levels: [junior, mid, senior]
    skill_tags: [product_manager, stakeholder, collaboration, alignment, communication]
    direction_tags: [business]
    role_tags: [product_manager]
    rubric:
      must_cover: [目标差异, 证据对齐, 冲突处理, 后续机制]
      minimum_bar: 能说明跨团队项目中各方目标和约束，并推动形成可执行共识。
      stretch: 能在冲突后沉淀协作机制，减少类似问题再次发生。
    priority: 27
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: stakeholder_management.cross_team_alignment.engineering_pushback
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 研发认为 PRD 边界不清、风险太高，希望延后需求，但业务方要求本周给排期。
        question_stem: 面对研发强烈反对需求排期时，你会如何厘清真实分歧并推动收敛？
        prompt_template: 生成一道产品协同题，要求候选人说明研发关切、证据对齐、范围调整和决策闭环。
        scenario_skill_tags: [product_manager, stakeholder, engineering_alignment, prd]
        resume_anchor_hints: [prd, engineering, stakeholder, conflict, product]
        failure_categories: [weak_stakeholder_alignment, missing_evidence, missing_action]
        rubric_additions: [说明研发真实关切, 说明用证据对齐范围, 说明后续跟进机制]
        expected_signals: [能区分反对表象和风险实质, 能用范围或验收标准收敛, 能维护协作关系]
        anti_patterns: [用职级压研发, 只让业务方拍板, 不处理风险]
        good_answer_hints: [先听清关切, 再用证据缩范围, 最后确认责任和时间点]
        priority: 16
        status: active
      - id: stakeholder_management.cross_team_alignment.multi_team_conflict
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 市场、销售、客服和研发都参与一个发布项目，各自 KPI 不同，关键节点反复延期。
        question_stem: 多团队目标不一致导致项目卡住时，你会如何建立共同目标和推进节奏？
        prompt_template: 生成一道跨团队推进追问，要求候选人说明目标拆解、角色责任、风险升级和沟通机制。
        scenario_skill_tags: [product_manager, stakeholder, cross_function, project_management]
        resume_anchor_hints: [cross_function, stakeholder, launch, product, communication]
        failure_categories: [weak_stakeholder_alignment, missing_risk, unclear_owner]
        rubric_additions: [说明各方 KPI 和约束, 说明共同目标和 RACI, 说明风险升级机制]
        expected_signals: [能画清责任边界, 能设计节奏和升级路径, 能平衡目标和关系]
        anti_patterns: [只开会不决策, 责任人不清, 风险暴露太晚]
        good_answer_hints: [先对齐共同目标, 再明确责任节奏, 最后设置风险升级]
        priority: 15
        status: active
