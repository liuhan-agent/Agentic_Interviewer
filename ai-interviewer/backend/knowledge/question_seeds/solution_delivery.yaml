        scenario_brief: Engineering cannot fix the root cause immediately, but a workaround can reduce customer impact.
        question_stem: How would you explain the workaround, confirm it is acceptable, and track the final solution to closure?
        prompt_template: Generate a customer success question about workaround delivery and closure management.
        scenario_skill_tags: [customer_success, solution_delivery, workaround, closure]
