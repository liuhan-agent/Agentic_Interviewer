        scenario_brief: The customer problem is partly caused by usage misunderstanding across several customer teams.
        question_stem: How would you design a solution that closes the current issue and prevents the same confusion from recurring?
        prompt_template: Generate a deep probe about customer solution delivery through enablement and prevention.
        scenario_skill_tags: [customer_success, solution_delivery, enablement, prevention]
