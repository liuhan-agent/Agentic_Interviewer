dimension: user_insight
seeds:
  - id: user_insight.user_journey_pain_point
    version: 1
    title: 用户旅程与真实痛点识别
    dimension: user_insight
    job_levels: [junior, mid, senior]
    skill_tags: [product_manager, user_insight, user_research, journey_mapping, pain_point]
    direction_tags: [business]
    role_tags: [product_manager]
    rubric:
      must_cover: [目标用户, 使用场景, 真实痛点, 证据来源]
      minimum_bar: 能从真实项目中说明用户是谁、在什么场景下遇到什么问题，以及如何验证。
      stretch: 能识别表层诉求和真实痛点的差异，并说明错误洞察会带来的产品风险。
    priority: 30
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: user_insight.user_journey_pain_point.cross_channel_onboarding
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 新用户来自小程序、App 和社群三个入口，激活率差异很大，团队怀疑首日体验没有击中真实场景。
        question_stem: 你会如何还原不同入口用户的完整旅程，并判断真正阻碍激活的痛点是什么？
        prompt_template: 围绕候选人的产品项目，生成一道用户洞察题，要求说明用户分层、场景还原、证据来源和痛点判断。
        scenario_skill_tags: [product_manager, user_insight, onboarding, journey_mapping]
        resume_anchor_hints: [product, onboarding, user_research, activation, user_journey]
        failure_categories: [missing_evidence, vague_user, shallow_analysis]
        rubric_additions: [说明不同入口用户的任务和动机, 说明访谈或数据证据, 说明痛点优先级判断]
        expected_signals: [能分清用户表述和真实任务, 能结合行为数据与访谈, 能指出误判痛点的后果]
        anti_patterns: [只描述功能流程, 用自己想象替代用户证据, 不区分用户分层]
        good_answer_hints: [先拆用户与场景, 再收集证据, 最后判断关键痛点]
