      - id: user_insight.user_journey_pain_point.segment_noise
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 一小部分高频用户声音很大，希望增加复杂能力，但大盘新用户仍在基础路径上流失。
        question_stem: 面对高声量用户诉求和大盘用户痛点冲突时，你会如何判断该听谁、为什么？
        prompt_template: 生成一道产品用户分层追问，要求候选人说明用户价值、样本偏差、数据证据和取舍方式。
        scenario_skill_tags: [product_manager, user_segmentation, user_insight, prioritization]
        resume_anchor_hints: [user_research, segmentation, product, feedback, activation]
        failure_categories: [weak_prioritization, missing_tradeoff, missing_evidence]
        rubric_additions: [说明样本偏差风险, 说明用户价值和规模判断, 说明最终取舍与验证]
        expected_signals: [能识别高声量不等于高价值, 能用数据校准反馈, 能说明取舍后的验证方式]
        anti_patterns: [谁声音大听谁, 完全忽略核心用户, 没有后续验证]
        good_answer_hints: [先判断用户价值, 再看诉求代表性, 最后设计低成本验证]
