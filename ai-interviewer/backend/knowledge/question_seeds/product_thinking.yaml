        expected_signals: [能区分回复率和解决率, 能分析负反馈, 能设计人工 review 样本]
        anti_patterns: [只看调用量, 不看用户是否解决问题, 没有反馈入口]
        good_answer_hints: [先定义成功标准, 再采集反馈, 最后形成迭代样本]
        priority: 16
        status: active
      - id: product_thinking.ai_agent_effect_loop.user_control
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: Agent 自动执行任务效率很高，但用户担心不可控和不可解释。
        question_stem: 你会如何设计 Agent 的用户确认、解释和撤销体验？
        prompt_template: 生成一道 Agent 产品体验深挖题，要求候选人说明用户控制、解释和风险动作确认。
        scenario_skill_tags: [agent, user control, explainability, product]
        resume_anchor_hints: [agent, user experience, explainability, product, workflow]
        failure_categories: [missing_tradeoff, missing_edge_case, missing_action]
        rubric_additions: [说明高风险动作确认, 说明过程解释, 说明撤销和人工接管]
        expected_signals: [能按风险等级设计确认, 能展示关键证据, 能提供撤销或回滚]
        anti_patterns: [所有动作全自动, 不解释执行依据, 用户无法纠错]
        good_answer_hints: [先分风险动作, 再设计确认和解释, 最后补撤销]
        priority: 14
        status: active
