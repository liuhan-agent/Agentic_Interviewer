    direction_tags: [internet_tech]
    role_tags: [ai_fullstack]
    rubric:
      must_cover: [用户路径, 体验指标, 模型质量, 工程约束]
      minimum_bar: 能说明 AI 功能的体验指标如何连接技术质量和业务结果。
      stretch: 能区分模型质量、交互体验、成本延迟和用户价值之间的取舍。
    priority: 25
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: product_thinking.ai_fullstack_experience_metrics.ai_copilot
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: AI Copilot 功能上线后使用率不错，但用户经常复制后大幅修改输出。
        question_stem: 你会如何评估 AI Copilot 的真实用户价值和体验质量？
        prompt_template: 结合候选人的 AI 应用交付经验，生成一道产品指标题，要求说明体验、质量和业务价值。
        scenario_skill_tags: [ai fullstack, copilot, product metric, user experience]
        resume_anchor_hints: [copilot, llm, product, metric, fullstack]
        failure_categories: [vague_metrics, missing_tradeoff, missing_action]
        rubric_additions: [说明采用率和编辑率, 说明任务完成和满意度, 说明质量样本分析]
        expected_signals: [能看采纳和修改行为, 能区分使用率和价值, 能结合定性反馈]
        anti_patterns: [只看调用次数, 不看输出是否被采用, 不分析用户路径]
        good_answer_hints: [先定义用户任务, 再设计行为指标, 最后结合质量抽样]
        priority: 15
        status: active
      - id: product_thinking.ai_fullstack_experience_metrics.latency_quality_tradeoff
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 更强模型质量更好但响应慢且成本高，轻量模型体验快但答案不稳定。
        question_stem: AI 功能中模型质量、延迟和成本冲突时，你会如何设计产品策略？
        prompt_template: 生成一道 AI 全栈产品取舍题，要求候选人说明模型选择、体验分层和指标验证。
        scenario_skill_tags: [ai fullstack, latency, quality, cost, product]
        resume_anchor_hints: [llm, latency, cost, product, metric]
        failure_categories: [missing_tradeoff, vague_metrics, missing_edge_case]
        rubric_additions: [说明不同场景的质量要求, 说明延迟和成本约束, 说明分层策略和实验验证]
        expected_signals: [能按任务风险选模型, 能设计快慢路径, 能用实验验证体验]
        anti_patterns: [所有场景用同一个模型, 只追求质量不看体验, 不做成本归因]
        good_answer_hints: [先分场景和风险, 再匹配模型策略, 最后用指标验证]
        priority: 14
        status: active
