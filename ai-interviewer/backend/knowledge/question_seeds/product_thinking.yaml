  - id: product_thinking.ai_agent_negative_scope
    version: 1
    title: Agent 任务的"不要做什么"边界设定
    dimension: product_thinking
    job_levels: [junior, mid, senior]
    skill_tags: [agent, product, negative scope, safety, user trust]
    direction_tags: [internet_tech]
    role_tags: [ai_agent]
    rubric:
      must_cover: [产品定位, 不可做清单, 用户预期管理, 风险沟通]
      minimum_bar: 能说明 Agent 产品定义"不要做什么"对用户信任的重要性。
      stretch: 能用 negative scope、UI 提示和拒答模板形成完整边界。
    priority: 25
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: product_thinking.ai_agent_negative_scope.refusal_design
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 一个内部研发助手 Agent 经常被用户问到法律 / 财务 / 医疗等超出能力范围的问题。
        question_stem: 你会如何为 Agent 产品定义"不要做什么"的边界并在体验上落地？
        prompt_template: 结合候选人的 Agent / 产品经验，生成一道产品思维题，要求说明不可做清单与拒答体验。
        scenario_skill_tags: [agent, product, negative scope, refusal, user trust]
        resume_anchor_hints: [agent, product, scope, refusal, user]
        failure_categories: [missing_action, missing_edge_case, missing_tradeoff]
        rubric_additions: [说明不可做清单维度, 说明拒答体验设计, 说明用户预期教育]
        expected_signals: [能列出 3-5 个明确不做的场景, 能设计清晰拒答 + 替代方案模板, 能在新手 onboarding 教育预期]
        anti_patterns: [拒答模糊或道歉式, 不给替代方案, 用户教育缺失]
        good_answer_hints: [先列不可做, 再做拒答体验, 最后做用户教育]
        priority: 15
        status: active
      - id: product_thinking.ai_agent_negative_scope.boundary_evolution
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 随着模型能力提升，曾经"不做"的领域（如简单合同审查）可能逐步可以做。
        question_stem: 当 Agent 能力扩展时，你会如何安全地放开"不要做"边界而不伤害用户信任？
        prompt_template: 生成一道 Agent 边界演进深挖题，要求候选人说明灰度、用户预期管理和回滚。
        scenario_skill_tags: [agent, scope evolution, gradual rollout, trust]
        resume_anchor_hints: [agent, scope, evolution, rollout, trust]
        failure_categories: [missing_tradeoff, missing_action, missing_observability]
        rubric_additions: [说明灰度试点选择, 说明用户预期更新, 说明回滚信号]
        expected_signals: [能选择低风险用户群灰度, 能在体验里更新能力清单, 能定义回滚指标]
        anti_patterns: [一次性大改边界, 不预告新能力, 出问题没回滚机制]
        good_answer_hints: [先选灰度群, 再更新预期, 最后定回滚]
        priority: 13
        status: active

