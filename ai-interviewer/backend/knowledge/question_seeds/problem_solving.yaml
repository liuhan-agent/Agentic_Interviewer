        question_stem: 你会如何设计支付后异步任务的重试、幂等、死信和人工处理流程？
        prompt_template: 结合候选人的 Java 后端经验，生成一道问题解决题，要求说明任务状态机、重试节奏、幂等键、死信告警和恢复动作。
