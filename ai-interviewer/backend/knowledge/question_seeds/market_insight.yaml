    rubric:
      must_cover: [洞察来源, 竞品分析, 用户变化, 策略影响]
      minimum_bar: 能说明市场判断来自哪些信号，以及如何影响后续策略。
      stretch: 能处理多源信号冲突，并识别趋势判断中的不确定性。
    priority: 30
