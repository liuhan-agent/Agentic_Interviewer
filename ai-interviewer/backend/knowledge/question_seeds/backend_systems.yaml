    job_levels: [mid, senior, staff]
    skill_tags: [async job, retry, queue, idempotency]
    direction_tags: [internet_tech]
    role_tags: [java_backend]
    rubric:
      must_cover: [任务状态, 重试策略, 幂等处理, 死信与告警]
      minimum_bar: 能设计至少一次执行下的幂等任务处理。
      stretch: 能处理延迟任务、退避、死信回放和任务可观测性。
    priority: 27
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: backend_systems.async_jobs_retries.email_receipt
        version: 1
        intent: followup
        difficulty: standard
        scenario_brief: 订单支付后需要异步发送凭证邮件，邮件服务偶发超时。
        question_stem: 请设计支付后发送邮件凭证的异步任务和重试方案。
        prompt_template: 生成一道异步任务追问题，要求候选人说明任务状态、重试和幂等。
        scenario_skill_tags: [message queue, retry, dead letter]
        resume_anchor_hints: [消息队列, 异步任务, 重试, 邮件]
        failure_categories: [missing_idempotency, shallow_failure_mode, missing_observability]
        rubric_additions: [说明任务唯一键, 说明指数退避和最大次数, 说明死信处理]
        expected_signals: [能接受至少一次投递, 能保证重复执行不产生副作用, 能设计失败告警]
        anti_patterns: [同步阻塞支付, 无限重试, 没有任务状态]
        good_answer_hints: [把发送邮件看成可重放副作用, 重点讨论幂等和状态机]
        priority: 18
        status: active
      - id: backend_systems.async_jobs_retries.delayed_refund
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 退款任务依赖第三方支付回调，部分任务需要延迟重试，超时后进入人工审核。
        question_stem: 你会如何设计退款异步任务的状态机、延迟重试、死信处理和人工审核入口？
        prompt_template: 生成一道异步任务深挖题，要求候选人说明状态迁移、重试语义、幂等和可观测性。
        scenario_skill_tags: [delayed job, retry, dead letter, idempotency]
        resume_anchor_hints: [refund, async job, retry, queue]
        failure_categories: [missing_idempotency, shallow_failure_mode, missing_observability]
        rubric_additions: [说明任务状态机, 说明退避和最大次数, 说明死信和人工处理]
        expected_signals: [能接受至少一次执行, 能用业务键防重复, 能区分可重试和不可重试失败]
        anti_patterns: [无限重试, 没有任务状态, 人工处理无审计]
        good_answer_hints: [先定义任务状态和幂等键, 再设计重试节奏和死信流转]
        priority: 15
        status: active

  - id: backend_systems.api_contracts_idempotency
    version: 1
    title: API 契约与幂等设计
    dimension: backend_systems
    job_levels: [mid, senior, staff]
    skill_tags: [api design, idempotency, contract, backwards compatibility]
    direction_tags: [internet_tech]
    role_tags: [java_backend]
    rubric:
      must_cover: [请求响应契约, 幂等键, 错误码, 向后兼容]
      minimum_bar: 能定义清晰 API 契约并解释重复请求行为。
      stretch: 能覆盖版本演进、客户端重试和审计追踪。
    priority: 25
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: backend_systems.api_contracts_idempotency.payment_create
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 客户端创建支付单时可能因为网络超时重复提交。
        question_stem: 请设计创建支付单 API 的契约和幂等策略。
        prompt_template: 生成一道 API 设计题，要求候选人明确字段、错误语义、幂等和兼容性。
        scenario_skill_tags: [rest api, idempotency key, error handling]
        resume_anchor_hints: [API, 支付, 幂等, REST]
        failure_categories: [missing_idempotency, vague_contract, missing_edge_case]
        rubric_additions: [说明幂等键作用域, 说明重复请求返回, 说明错误码和状态码]
        expected_signals: [能区分创建成功和处理中, 能处理客户端重试, 能避免破坏兼容]
        anti_patterns: [只靠前端禁用按钮, 每次请求都新建订单, 错误码含糊]
        good_answer_hints: [从请求字段和状态流转开始, 再讨论重复提交和兼容演进]
        priority: 16
        status: active
      - id: backend_systems.api_contracts_idempotency.client_retry_status
        version: 1
        intent: followup
        difficulty: standard
        scenario_brief: 客户端创建支付单超时后会查询状态并重试，服务端需要让调用方安全判断请求是否已生效。
        question_stem: 面对客户端超时后的查询和重试，你会如何设计 API 状态码、错误码、幂等键和兼容演进？
        prompt_template: 围绕候选人的 API 设计经验，生成一道幂等与契约追问题，要求说明重试后的可预期响应。
        scenario_skill_tags: [api design, idempotency key, status code, compatibility]
        resume_anchor_hints: [api, idempotency, retry, status code]
        failure_categories: [vague_contract, missing_idempotency, missing_edge_case]
        rubric_additions: [说明处理中和已成功响应, 说明幂等键作用域, 说明版本兼容]
        expected_signals: [能定义稳定错误语义, 能处理客户端重复提交, 能保留向后兼容]
        anti_patterns: [只返回 500, 每次重试新建资源, 破坏旧客户端字段]
        good_answer_hints: [先列客户端决策需要的信息, 再设计状态和错误语义]
        priority: 14
        status: active

