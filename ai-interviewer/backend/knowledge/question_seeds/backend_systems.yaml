dimension: backend_systems
seeds:
  - id: backend_systems.transaction_boundaries
    version: 1
    title: 事务边界与一致性补偿
    dimension: backend_systems
    job_levels: [mid, senior, staff]
    skill_tags: [transaction, consistency, compensation, database]
    direction_tags: [internet_tech]
    role_tags: [java_backend]
    rubric:
      must_cover: [事务边界, 并发控制, 补偿机制, 幂等保障]
      minimum_bar: 能说明哪些步骤必须同步事务内完成，哪些步骤可异步补偿。
      stretch: 能处理重试、乱序、重复消息和人工修复路径。
    priority: 30
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: backend_systems.transaction_boundaries.wallet_transfer
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 钱包转账涉及扣款、入账、流水和通知，任何一步失败都可能导致不一致。
        question_stem: 请设计钱包转账接口的事务边界和失败补偿方案。
        prompt_template: 生成一道后端事务设计题，要求候选人明确事务边界、幂等和异常恢复。
        scenario_skill_tags: [database transaction, idempotency, compensation]
        resume_anchor_hints: [支付, 钱包, 事务, 幂等]
        failure_categories: [missing_consistency_boundary, missing_idempotency, missing_edge_case]
        rubric_additions: [说明余额和流水的原子性, 说明重复请求处理, 说明补偿和对账]
        expected_signals: [能定义事务内不变量, 能使用唯一键或幂等号, 能设计对账修复]
        anti_patterns: [先扣款后异步记流水, 重试导致重复扣款, 没有对账]
        good_answer_hints: [先定义资金不变量, 再拆同步事务和异步副作用]
        priority: 20
        status: active
      - id: backend_systems.transaction_boundaries.outbox_compensation
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 钱包转账成功后通知、积分和账单流水需要异步完成，其中任一副作用失败都要可追踪和可补偿。
        question_stem: 如果资金主事务已成功但多个异步副作用可能失败，你会如何设计 outbox、补偿和人工修复流程？
        prompt_template: 结合候选人的支付、账务或事务经验，生成一道事务边界深挖题，要求说明 outbox 和补偿闭环。
        scenario_skill_tags: [outbox, compensation, idempotency, audit]
        resume_anchor_hints: [payment, transaction, outbox, compensation]
        failure_categories: [missing_consistency_boundary, missing_idempotency, missing_observability]
        rubric_additions: [说明主事务和 outbox 的原子性, 说明副作用幂等, 说明失败可观测和人工修复]
        expected_signals: [能区分资金不变量和副作用, 能处理重复投递, 能设计对账和修复入口]
        anti_patterns: [主事务里同步调用所有下游, 副作用失败无记录, 重试导致重复入账]
        good_answer_hints: [先固定资金不变量, 再把副作用放进可重放和可审计的 outbox]
        priority: 16
        status: active

  - id: backend_systems.async_jobs_retries
    version: 1
    title: 异步任务与重试语义
