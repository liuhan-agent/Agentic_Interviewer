    skill_tags: [incident response, debugging, observability, rollback]
    direction_tags: [internet_tech]
    role_tags: [java_backend]
    rubric:
      must_cover: [影响面判断, 证据收集, 止血方案, 复盘改进]
      minimum_bar: 能有条理地定位线上异常并给出止血路径。
      stretch: 能把告警、发布、回滚、数据修复和复盘闭环串起来。
    priority: 22
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: backend_systems.debugging_incident_response.latency_spike
        version: 1
        intent: recovery
        difficulty: standard
        scenario_brief: 刚发布后核心接口 P95 延迟翻倍，错误率轻微上升。
        question_stem: 请说明你会如何定位并处理这次线上延迟升高。
        prompt_template: 生成一道线上排障题，要求候选人按影响判断、证据收集、止血和复盘回答。
        scenario_skill_tags: [metrics, tracing, rollback, incident]
        resume_anchor_hints: [线上问题, 排障, 发布, 回滚]
        failure_categories: [shallow_debugging, missing_observability, missing_action]
        rubric_additions: [说明先止血再根因, 说明对比发布前后指标, 说明复盘措施]
        expected_signals: [能判断影响面, 能用指标日志链路追踪定位, 能选择回滚或降级]
        anti_patterns: [直接猜原因, 长时间只查代码不止血, 不做复盘]
        good_answer_hints: [按时间线排查发布变更, 先保护用户路径再深挖根因]
