      - id: backend_systems.debugging_incident_response.data_corruption
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 发布后少量订单状态被错误写入，影响范围不大但涉及用户权益和数据修复。
        question_stem: 如果线上发现少量订单状态被错误写入，你会如何止血、圈定影响、修复数据并做复盘预防？
        prompt_template: 生成一道线上事故深挖题，要求候选人按止血、证据、数据修复、回归验证和复盘展开。
        scenario_skill_tags: [incident, data repair, rollback, audit]
        resume_anchor_hints: [incident, rollback, data repair, audit]
        failure_categories: [missing_action, missing_observability, missing_edge_case]
        rubric_additions: [说明先止血和冻结写入, 说明影响面圈定, 说明修复脚本验证和审计]
        expected_signals: [能保护用户权益, 能用日志和快照圈定影响, 能设计灰度修复和回滚]
        anti_patterns: [直接手工改库无审计, 不通知相关方, 修复后不验证]
        good_answer_hints: [先止血和备份, 再圈定影响并小批量修复验证]
        priority: 12
        status: active
