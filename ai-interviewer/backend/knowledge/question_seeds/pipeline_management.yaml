        scenario_brief: 一个大单停留在方案阶段超过两个月，金额很大但客户内部推进信号变弱。
        question_stem: 你会如何判断这个大单是否仍然健康，并决定继续投入还是降级处理？
        prompt_template: 生成一道销售漏斗管理题，要求候选人说明阶段信号、停留时间、客户动作和资源取舍。
        scenario_skill_tags: [sales_business, pipeline, forecast, stalled_deal]
        resume_anchor_hints: [pipeline, crm, sales, forecast, customer]
        failure_categories: [weak_prioritization, vague_customer, missing_evidence]
