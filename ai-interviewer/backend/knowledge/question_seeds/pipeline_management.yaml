        expected_signals: [能看客户侧推进证据, 能判断停留风险, 能设置下一步验证]
        anti_patterns: [金额大就一直投入, CRM 阶段不更新, 不敢清理漏斗]
        good_answer_hints: [先看阶段信号, 再验证关键人动作, 最后决定投入强度]
        priority: 16
        status: active
      - id: pipeline_management.sales_forecast_risk.crm_hygiene
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 团队预测连续两个季度偏差很大，CRM 里很多商机缺少下一步动作和真实概率。
        question_stem: 销售预测不准时，你会如何改进 CRM 纪律和预测机制？
        prompt_template: 生成一道销售预测追问，要求候选人说明数据纪律、阶段定义、预测偏差复盘和团队机制。
        scenario_skill_tags: [sales_business, crm, pipeline, forecast_accuracy]
        resume_anchor_hints: [crm, forecast, sales, pipeline, review]
        failure_categories: [vague_metrics, missing_process, missing_action]
        rubric_additions: [说明 CRM 字段和阶段标准, 说明预测偏差复盘, 说明机制改进]
        expected_signals: [能把 CRM 看成管理资产, 能校准阶段概率, 能建立复盘节奏]
        anti_patterns: [只责怪销售填得差, 不定义阶段, 不复盘预测偏差]
