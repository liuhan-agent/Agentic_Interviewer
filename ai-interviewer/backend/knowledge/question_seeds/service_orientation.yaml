      - id: service_orientation.hr_internal_service_triage.repeated_policy_questions
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: Managers repeatedly ask the same policy questions, creating slow HR response and inconsistent answers.
        question_stem: How would you improve the HR service process so repeated policy questions become easier and more consistent?
        prompt_template: Generate a deep probe about internal HR service process improvement.
        scenario_skill_tags: [hr_function, service_orientation, process_optimization, policy_support]
        resume_anchor_hints: [policy, internal_service, process, knowledge_base, manager]
        failure_categories: [shallow_analysis, missing_metrics, weak_follow_up]
        rubric_additions: [Identify repeated demand, standardize response, measure service improvement]
        expected_signals: [Builds FAQ or workflow, clarifies ownership, tracks response time and satisfaction]
        anti_patterns: [Only asks managers to be patient, creates complex process, does not measure effect]
        good_answer_hints: [Find repeat cases, standardize first answer, monitor cycle time]
