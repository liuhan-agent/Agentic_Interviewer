        scenario_skill_tags: [customer_success, issue_diagnosis, cross_team_handoff, support]
        resume_anchor_hints: [handoff, support, engineering, product, customer_configuration]
        failure_categories: [weak_stakeholder_alignment, missing_evidence, poor_communication]
        rubric_additions: [Summarize evidence, separate hypotheses, define owner and next check]
        expected_signals: [Creates concise issue packet, tracks owner, keeps customer updated]
