dimension: project_experience
seeds:
  - id: project_experience.ai_fullstack_end_to_end_delivery
    version: 1
    title: AI 全栈端到端交付经验
    dimension: project_experience
    job_levels: [mid, senior]
    skill_tags: [ai fullstack, delivery, llm, product, engineering]
    direction_tags: [internet_tech]
    role_tags: [ai_fullstack]
    rubric:
      must_cover: [需求拆解, 技术落地, 联调上线, 效果复盘]
      minimum_bar: 能讲清一个 AI 应用从需求到上线的端到端交付过程。
      stretch: 能说明如何处理模型不确定性、业务反馈和工程质量之间的冲突。
    priority: 25
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: project_experience.ai_fullstack_end_to_end_delivery.internal_copilot
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 候选人参与过内部 AI Copilot 或知识助手，从需求、开发到上线都有参与。
        question_stem: 请你复盘一个 AI 全栈项目从需求拆解到上线验证的完整过程。
        prompt_template: 结合候选人的 AI 全栈项目经历，生成一道项目经验题，要求追问职责、取舍和结果。
        scenario_skill_tags: [ai fullstack, delivery, copilot, llm]
        resume_anchor_hints: [ai application, copilot, llm, fullstack, delivery]
        failure_categories: [vague_ownership, vague_metrics, missing_tradeoff]
        rubric_additions: [说明本人职责, 说明关键技术取舍, 说明上线效果和复盘]
        expected_signals: [能说清负责模块, 能解释方案选择, 能给出效果和问题]
        anti_patterns: [只说项目背景, 不说个人贡献, 没有上线结果]
        good_answer_hints: [先讲目标和职责, 再讲关键决策, 最后讲结果和复盘]
        priority: 15
        status: active
      - id: project_experience.ai_fullstack_end_to_end_delivery.feedback_iteration
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: AI 功能第一版上线后用户反馈质量不稳定，团队需要快速迭代。
        question_stem: AI 功能上线后效果不稳定时，你在项目中会如何推动迭代和验证？
        prompt_template: 生成一道 AI 全栈项目复盘深挖题，要求候选人说明反馈收集、问题拆解和迭代节奏。
        scenario_skill_tags: [ai fullstack, feedback, iteration, evaluation]
        resume_anchor_hints: [feedback, iteration, llm, evaluation, delivery]
        failure_categories: [missing_action, shallow_debugging, vague_metrics]
        rubric_additions: [说明反馈来源, 说明问题拆解, 说明迭代验证和风险控制]
        expected_signals: [能把反馈转成样本和指标, 能拆模型和产品问题, 能小步灰度验证]
        anti_patterns: [只改 prompt, 不收集样本, 不验证迭代效果]
        good_answer_hints: [先收集典型反馈, 再拆根因, 最后用样本和指标验证]
        priority: 14
        status: active
  - id: project_experience.mobile_release_gray_monitoring
    version: 1
    title: 移动端发布灰度与质量监控
    dimension: project_experience
    job_levels: [mid, senior]
    skill_tags: [mobile, release, gray rollout, monitoring, app]
    direction_tags: [internet_tech]
    role_tags: [mobile]
    rubric:
      must_cover: [版本发布, 灰度策略, 质量指标, 回滚预案]
      minimum_bar: 能说明移动端版本发布和线上质量监控的实际流程。
      stretch: 能结合多端差异、渠道限制、热修复和用户反馈治理质量。
    priority: 24
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: project_experience.mobile_release_gray_monitoring.version_rollout
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 移动 App 新版本包含支付和登录改动，团队需要控制发布风险。
        question_stem: 请你讲一次移动端重要版本发布时如何做灰度、监控和风险处理。
        prompt_template: 结合候选人的移动端发布经验，生成一道项目经验题，要求说明发布流程、指标和应急动作。
        scenario_skill_tags: [mobile, release, monitoring, gray rollout]
        resume_anchor_hints: [mobile, release, app, monitoring, gray]
        failure_categories: [vague_ownership, missing_metrics, missing_action]
        rubric_additions: [说明发布节奏, 说明崩溃和核心链路指标, 说明暂停或回滚预案]
        expected_signals: [能说明灰度比例和渠道, 能看 crash free 和核心转化, 能处理异常发布]
        anti_patterns: [全量发布后再观察, 不看版本指标, 没有应急预案]
        good_answer_hints: [先讲发布策略, 再讲监控指标, 最后讲异常处理]
        priority: 15
        status: active
      - id: project_experience.mobile_release_gray_monitoring.hotfix_review
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 线上移动端出现严重问题，需要在热修复、回滚和等待商店审核之间选择。
        question_stem: 移动端线上问题需要快速修复时，你会如何权衡热修复、回滚和重新发版？
        prompt_template: 生成一道移动端项目复盘深挖题，要求候选人说明修复路径选择、风险和验证。
        scenario_skill_tags: [mobile, hotfix, rollback, release]
        resume_anchor_hints: [mobile, hotfix, rollback, app store, release]
        failure_categories: [missing_tradeoff, missing_action, missing_edge_case]
        rubric_additions: [说明修复方式取舍, 说明验证和灰度, 说明用户影响和沟通]
        expected_signals: [能考虑平台审核和热修限制, 能做最小修复, 能验证核心链路]
        anti_patterns: [盲目热修, 不考虑审核周期, 不验证修复风险]
        good_answer_hints: [先判断影响和时效, 再选修复路径, 最后做验证和沟通]
        priority: 13
        status: active
