        failure_categories: [vague_user, poor_communication, missing_evidence]
        rubric_additions: [Acknowledge emotion, clarify business impact, avoid overpromising]
        expected_signals: [Listens before solution, asks impact questions, sets clear next step]
        anti_patterns: [Defends the team first, promises instant fix, ignores customer emotion]
