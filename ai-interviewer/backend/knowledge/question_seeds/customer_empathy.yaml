        difficulty: deep_probe
        scenario_brief: Several customers give low satisfaction scores, but their tickets were technically closed on time.
        question_stem: How would you investigate the gap between ticket closure and customer perceived service quality?
        prompt_template: Generate a deep probe about customer empathy metrics and service perception.
        scenario_skill_tags: [customer_success, customer_empathy, satisfaction, support_quality]
        resume_anchor_hints: [csat, nps, support, customer_feedback, service_quality]
        failure_categories: [missing_metrics, shallow_analysis, weak_follow_up]
        rubric_additions: [Compare process metrics with sentiment, sample interactions, define improvement loop]
        expected_signals: [Looks beyond SLA, analyzes feedback text, identifies experience gaps]
        anti_patterns: [Says SLA is enough, ignores qualitative feedback, blames customer expectations]
