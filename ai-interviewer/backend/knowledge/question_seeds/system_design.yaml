        difficulty: deep_probe
        scenario_brief: 主站首页依赖推荐服务，推荐服务延迟抖动会拖垮首页。
        question_stem: 请设计首页对推荐服务的隔离、降级和恢复方案。
        prompt_template: 生成一道故障隔离深挖题，要求候选人处理慢依赖、降级内容和恢复流程。
        scenario_skill_tags: [circuit breaker, timeout, fallback, bulkhead]
        resume_anchor_hints: [降级, 熔断, 稳定性, SLA, SLO]
        failure_categories: [shallow_failure_mode, missing_observability, missing_tradeoff]
        rubric_additions: [说明超时预算, 说明默认内容或缓存兜底, 说明恢复观察窗口]
        expected_signals: [能把超时重试和熔断联系起来, 能隔离资源池, 能设计恢复验证]
        anti_patterns: [无限重试, 全量关闭核心功能, 没有回切策略]
        good_answer_hints: [先标出依赖链路, 再给隔离策略, 最后说明降级体验和恢复门槛]
        priority: 16
        status: active
      - id: system_design.failure_isolation.payment_dependency
        version: 1
        intent: followup
        difficulty: standard
        scenario_brief: 下单链路依赖支付风控服务，风控偶发超时会放大为下单失败和用户投诉。
        question_stem: 如果支付风控服务不稳定，你会如何划分同步依赖、超时预算、降级策略和恢复验证？
        prompt_template: 结合候选人的核心链路稳定性经验，生成一道故障隔离追问题，要求说明同步边界和降级可接受性。
        scenario_skill_tags: [timeout, fallback, circuit breaker, dependency isolation]
        resume_anchor_hints: [payment, timeout, fallback, circuit breaker]
        failure_categories: [shallow_failure_mode, missing_tradeoff, missing_observability]
        rubric_additions: [说明哪些请求必须阻断, 说明超时和熔断阈值, 说明恢复后的补偿或审计]
        expected_signals: [能区分安全风控和体验降级, 能给出超时预算, 能说明回切观察窗口]
        anti_patterns: [无条件放行, 无限重试, 没有恢复验证]
        good_answer_hints: [先按业务风险分级, 再设计隔离降级和恢复验证]
        priority: 13
        status: active

