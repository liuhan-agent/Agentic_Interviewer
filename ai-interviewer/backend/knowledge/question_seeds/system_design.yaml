  - id: system_design.capacity_planning
    version: 1
    title: 容量规划与削峰
    dimension: system_design
    job_levels: [junior, mid, senior, staff]
    skill_tags: [capacity planning, queue, rate limiting, scalability]
    direction_tags: [internet_tech]
    role_tags: [java_backend]
    rubric:
      must_cover: [流量估算, 瓶颈定位, 削峰限流, 扩容策略]
      minimum_bar: 能基于业务假设推导核心容量，并说明至少一种保护系统的手段。
      stretch: 能把容量、成本、可用性和用户体验放在同一套权衡里。
    priority: 26
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: system_design.capacity_planning.live_event_ticketing
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 演唱会开票瞬时流量暴涨，读写峰值相差数十倍。
        question_stem: 请设计开票系统的容量规划、限流和削峰方案。
        prompt_template: 生成一道围绕容量估算和流量保护的系统设计题，追问候选人的量化推理。
        scenario_skill_tags: [rate limiting, queue, autoscaling]
        resume_anchor_hints: [高并发, 限流, 消息队列, autoscaling]
        failure_categories: [missing_metrics, vague_scale, missing_tradeoff]
        rubric_additions: [要求候选人先给流量假设, 要求解释排队和拒绝策略, 要求说明扩容触发条件]
        expected_signals: [能做数量级估算, 能设计限流排队和熔断, 能讨论热点资源保护]
        anti_patterns: [直接堆机器, 没有容量公式, 忽略用户等待体验]
        good_answer_hints: [用峰值 QPS 和库存写入比例展开, 说明保护核心库存链路]
        priority: 18
        status: active
      - id: system_design.capacity_planning.queue_backpressure
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: 活动峰值超过预估三倍，入口限流后仍有大量请求堆积在队列和库存写入链路。
        question_stem: 当活动流量超过预估且队列开始堆积时，你会如何设计背压、削峰、扩容和用户体验降级？
        prompt_template: 围绕候选人的高并发或队列经验，生成一道容量规划深挖题，要求量化瓶颈、背压策略和降级边界。
        scenario_skill_tags: [queue, backpressure, rate limiting, autoscaling]
        resume_anchor_hints: [queue, rate limiting, high traffic, autoscaling]
        failure_categories: [vague_scale, missing_tradeoff, missing_metrics]
        rubric_additions: [说明队列水位和处理速率, 说明入口与下游背压关系, 说明扩容和降级触发条件]
        expected_signals: [能用吞吐差估算堆积, 能区分保护库存和保护体验, 能提出可观测指标]
        anti_patterns: [只说加机器, 没有拒绝策略, 不估算队列耗尽时间]
        good_answer_hints: [先估算峰值与消费能力差, 再设计限流排队降级和扩容]
        priority: 14
        status: active

  - id: system_design.failure_isolation
