        question_stem: 如果 Redis 故障切换导致库存缓存短暂读旧，你会怎样设计检测、阻断、修复和对账流程？
        prompt_template: 结合候选人的 Redis 或高并发项目经验，生成一道追问缓存故障切换后一致性修复的系统设计题。
        scenario_skill_tags: [redis, failover, reconciliation]
        resume_anchor_hints: [redis, cache, failover, inventory]
        failure_categories: [missing_failure_mode, missing_observability, missing_metrics]
        rubric_additions: [说明故障检测信号, 说明阻断或降级策略, 说明异步对账和修复闭环]
        expected_signals: [能区分读旧窗口和资金库存不变量, 能提出监控告警和对账任务, 能说明人工兜底边界]
        anti_patterns: [只说重试, 只清缓存不解释对账, 没有业务阻断策略]
        good_answer_hints: [先定义不可破坏的不变量, 再设计检测阻断修复三段流程]
