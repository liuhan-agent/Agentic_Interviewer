      - id: talent_acquisition.hr_role_qualification.funnel_quality_drop
        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: Candidate volume is high but interview pass rate is low, and the business team doubts HR screening quality.
        question_stem: How would you diagnose the recruiting funnel and decide whether the problem is sourcing, screening, or role calibration?
        prompt_template: Generate a deep probe about recruiting funnel diagnosis and evidence based adjustment.
        scenario_skill_tags: [hr_function, recruiting_funnel, screening_quality, stakeholder_alignment]
        resume_anchor_hints: [funnel, recruiting, interview_pass_rate, sourcing, calibration]
        failure_categories: [missing_metrics, shallow_analysis, weak_prioritization]
        rubric_additions: [Use funnel conversion data, compare pass reasons and rejection reasons, propose adjustment cycle]
        expected_signals: [Uses data by stage, checks requirement drift, proposes calibration review]
        anti_patterns: [Blames candidate quality only, adds more channels without diagnosis, ignores interviewer feedback]
        good_answer_hints: [Read funnel data first, sample interview feedback, adjust sourcing and screening together]
