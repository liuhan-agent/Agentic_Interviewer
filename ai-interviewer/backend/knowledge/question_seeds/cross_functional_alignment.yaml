        question_stem: How would you identify the real conflict and drive alignment without letting the loudest team decide?
        prompt_template: Generate a management alignment question about stakeholder goals, conflict source, and decision rights.
        scenario_skill_tags: [general_management, cross_functional_alignment, stakeholder_alignment, conflict_resolution]
        resume_anchor_hints: [cross_functional, alignment, stakeholder, launch, conflict]
        failure_categories: [weak_stakeholder_alignment, missing_tradeoff, poor_communication]
        rubric_additions: [Map stakeholder goals, surface tradeoffs, define decision owner]
        expected_signals: [Names each team's incentive, creates decision criteria, communicates final tradeoff]
        anti_patterns: [Lets seniority decide, avoids conflict, treats alignment as one meeting]
        good_answer_hints: [Map goals, define tradeoff criteria, name decision owner and follow up]
