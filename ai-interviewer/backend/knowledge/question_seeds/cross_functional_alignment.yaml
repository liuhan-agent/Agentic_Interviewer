        version: 1
        intent: deep_probe
        difficulty: deep_probe
        scenario_brief: Cross team alignment breaks down repeatedly because decisions are revisited after meetings.
        question_stem: How would you change the alignment mechanism so decisions are recorded, owned, and followed through?
        prompt_template: Generate a deep probe about recurring cross functional alignment failure.
        scenario_skill_tags: [general_management, cross_functional_alignment, decision_rights, operating_mechanism]
        resume_anchor_hints: [alignment, decision, stakeholder, governance, management]
        failure_categories: [vague_process, weak_follow_up, poor_communication]
        rubric_additions: [Clarify decision record, owner, escalation path, and review rhythm]
        expected_signals: [Creates decision log, defines owner, escalates unresolved tradeoffs]
        anti_patterns: [Adds more meetings only, relies on memory, avoids naming owner]
        good_answer_hints: [Record decisions, assign owner, make reopening conditions explicit]
