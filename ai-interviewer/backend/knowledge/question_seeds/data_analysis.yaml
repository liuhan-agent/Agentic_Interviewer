        question_stem: 实验结果看似显著但样本偏斜时，你会如何判断是否能推广到全量？
        prompt_template: 生成一道运营实验追问，要求候选人说明样本代表性、显著性、分层分析和上线决策。
        scenario_skill_tags: [operations, experiment, data_analysis, sample_bias]
        resume_anchor_hints: [ab_test, experiment, metric, data_analysis, operations]
        failure_categories: [missing_evidence, missing_risk, shallow_analysis]
        rubric_additions: [说明样本偏斜风险, 说明分层验证, 说明灰度或补充实验]
        expected_signals: [能识别样本代表性问题, 能提出分层或补样, 能谨慎做全量决策]
        anti_patterns: [只看显著性, 不看样本结构, 直接全量上线]
        good_answer_hints: [先审样本, 再做分层, 最后灰度验证]
