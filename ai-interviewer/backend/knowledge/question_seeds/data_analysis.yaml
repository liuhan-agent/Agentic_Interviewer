        scenario_brief: 最近一周 GMV 下滑，但流量、客单价、转化率都有小幅波动。
        question_stem: 你会如何拆解数据来定位 GMV 下滑的根因，并判断下一步动作？
        prompt_template: 生成一道运营数据分析题，要求候选人说明指标树、分群拆解、假设排序和验证动作。
        scenario_skill_tags: [operations, data_analysis, metric_tree, gmv]
        resume_anchor_hints: [gmv, data_analysis, metric, operations, diagnosis]
        failure_categories: [shallow_analysis, vague_metrics, missing_attribution]
        rubric_additions: [说明指标树拆解, 说明分群或渠道分析, 说明行动和验证]
        expected_signals: [能从 GMV 拆到流量转化客单, 能看渠道和人群, 能提出验证优先级]
        anti_patterns: [只看总盘, 直接归因到一个原因, 没有下一步动作]
        good_answer_hints: [先建指标树, 再分群定位, 最后验证最可能假设]
        priority: 17
        status: active
      - id: data_analysis.operations_metric_diagnosis.ab_experiment
        version: 1
        intent: deep_probe
