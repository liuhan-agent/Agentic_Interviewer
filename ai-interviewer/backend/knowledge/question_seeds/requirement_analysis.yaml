    version: 1
    title: 需求拆解与版本边界定义
    dimension: requirement_analysis
    job_levels: [junior, mid, senior]
    skill_tags: [product_manager, requirement_analysis, prd, scope, mvp]
    direction_tags: [business]
    role_tags: [product_manager]
    rubric:
      must_cover: [业务目标, 用户场景, 需求边界, 验收标准]
      minimum_bar: 能把一句业务诉求拆成目标、用户、场景、范围和衡量方式。
      stretch: 能解释为什么砍掉某些范围，以及如何为后续版本保留演进空间。
    priority: 29
    status: active
    source: manual_yaml
    scope: global
    language: zh-CN
    variants:
      - id: requirement_analysis.prd_scope_boundary.one_sentence_request
        version: 1
        intent: opening
        difficulty: standard
        scenario_brief: 业务方只提出一句话诉求，希望提升老用户复购，但没有明确目标人群和业务约束。
        question_stem: 接到一句话需求时，你会如何把它拆成可以进入 PRD 的清晰问题和边界？
        prompt_template: 生成一道产品需求分析题，要求候选人说明拆解框架、澄清问题、边界判断和验收指标。
        scenario_skill_tags: [product_manager, requirement_analysis, prd, business_goal]
        resume_anchor_hints: [prd, requirement, product, stakeholder, metric]
        failure_categories: [unclear_goal, missing_scope, vague_metrics]
        rubric_additions: [说明澄清问题清单, 说明目标和非目标, 说明验收指标]
        expected_signals: [能把诉求拆成问题定义, 能识别约束和边界, 能把结果转成验收标准]
        anti_patterns: [直接写功能清单, 不追问业务目标, 没有衡量方式]
        good_answer_hints: [先澄清目标, 再定义边界, 最后对齐验收]
