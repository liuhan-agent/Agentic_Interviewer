[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-interviewer"
version = "0.1.0"
description = "AI Interviewer Agentic Workflow - LangGraph based multi-agent interview system"
requires-python = ">=3.11"
authors = [{ name = "Agentic Interviewer Team" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3.7",
    "langsmith>=0.3",
    "chromadb==0.5.20",
    "openai>=1.54",
    "anthropic>=0.39",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "tiktoken>=0.8",
    "numpy>=1.26",
    "scipy>=1.14",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "socksio>=1.0.0",
    "websockets>=13.1",
    "python-multipart>=0.0.17",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "prometheus-client>=0.21",
    "rich>=13.9",
    "typer>=0.13",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]
voice = [
    "openai>=1.54",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
]

[project.scripts]
interviewer-demo = "app.scripts.run_demo:main"
interviewer-seed = "app.scripts.seed_kb:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
